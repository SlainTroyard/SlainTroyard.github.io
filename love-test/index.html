<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>恋人人格测试 · 你是什么恋爱人格？</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --rose: oklch(0.65 0.18 15);
  --rose-light: oklch(0.92 0.06 15);
  --rose-dark: oklch(0.45 0.2 15);
  --blush: oklch(0.88 0.08 350);
  --cream: oklch(0.97 0.01 80);
  --warm: oklch(0.95 0.02 60);
  --ink: oklch(0.2 0.02 30);
  --ink-light: oklch(0.45 0.02 30);
  --ink-faint: oklch(0.6 0.02 30);
  --gold: oklch(0.75 0.14 80);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: clamp(14px, 1.2vw, 18px); scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ═══════ LANDING ═══════ */
.landing {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 2rem;
  background:
    radial-gradient(ellipse at 20% 50%, oklch(0.95 0.08 350 / 0.4), transparent 60%),
    radial-gradient(ellipse at 80% 30%, oklch(0.93 0.06 300 / 0.3), transparent 50%),
    radial-gradient(ellipse at 50% 80%, oklch(0.95 0.05 50 / 0.3), transparent 50%),
    var(--cream);
  position: relative;
}
.landing::before {
  content: '';
  position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4a0a0' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
}
.landing-content { text-align: center; position: relative; z-index: 1; max-width: 640px; }
.landing-emoji { font-size: 5rem; margin-bottom: 1rem; display: block; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.landing h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 900;
  color: var(--rose-dark); letter-spacing: 0.08em; margin-bottom: 0.5rem; line-height: 1.2;
}
.landing .subtitle { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; color: var(--ink-light); letter-spacing: 0.15em; margin-bottom: 2rem; }
.landing .desc { font-size: 0.95rem; color: var(--ink-faint); line-height: 1.8; margin-bottom: 2.5rem; max-width: 520px; margin-left: auto; margin-right: auto; }
.dimension-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 2.5rem; }
.dimension-tags span { padding: 0.35rem 0.9rem; border-radius: 2rem; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.05em; }
.btn-start {
  display: inline-block; padding: 1rem 3rem;
  background: linear-gradient(135deg, var(--rose), var(--rose-dark));
  color: white; border: none; border-radius: 3rem;
  font-family: 'Noto Serif SC', serif; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.15em;
  cursor: pointer; transition: all 0.3s ease;
  box-shadow: 0 8px 30px oklch(0.6 0.15 15 / 0.3);
}
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 12px 40px oklch(0.6 0.15 15 / 0.4); }
.landing .note { margin-top: 1.5rem; font-size: 0.8rem; color: var(--ink-faint); }

/* ═══════ QUIZ ═══════ */
.quiz-container { display: none; min-height: 100vh; padding: 1.5rem; }
.quiz-header {
  position: sticky; top: 0; z-index: 100;
  background: oklch(0.97 0.01 80 / 0.92); backdrop-filter: blur(12px);
  padding: 1rem 0 0.8rem; margin-bottom: 1.5rem;
}
.quiz-header-inner { max-width: 700px; margin: 0 auto; }
.progress-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; font-size: 0.82rem; color: var(--ink-light); }
.progress-info .q-num { font-weight: 700; color: var(--rose-dark); font-size: 0.9rem; }
.dimension-label { padding: 0.2rem 0.7rem; border-radius: 1rem; font-size: 0.72rem; font-weight: 500; }
.progress-bar { width: 100%; height: 6px; background: oklch(0.9 0.03 15); border-radius: 3px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--rose), var(--gold)); border-radius: 3px; transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }
.question-card {
  max-width: 700px; margin: 0 auto;
  background: white; border-radius: 1.2rem;
  padding: clamp(1.5rem, 4vw, 2.5rem);
  box-shadow: 0 4px 24px oklch(0.8 0.02 30 / 0.3);
  animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1);
}
@keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
.question-card .q-context { font-size: 0.82rem; color: var(--ink-faint); margin-bottom: 0.8rem; font-style: italic; }
.question-card h2 { font-family: 'Noto Serif SC', serif; font-size: clamp(1.1rem,2.5vw,1.35rem); font-weight: 700; color: var(--ink); line-height: 1.6; margin-bottom: 1.8rem; }
.options { display: flex; flex-direction: column; gap: 0.7rem; }
.option-btn {
  display: flex; align-items: flex-start; gap: 0.9rem;
  padding: 1rem 1.2rem; background: var(--warm); border: 2px solid transparent;
  border-radius: 0.8rem; cursor: pointer; transition: all 0.25s ease;
  text-align: left; font-family: inherit; font-size: 0.92rem; color: var(--ink); line-height: 1.5;
}
.option-btn:hover { background: var(--rose-light); border-color: oklch(0.8 0.08 15); transform: translateX(4px); }
.option-btn.selected { background: var(--rose-light); border-color: var(--rose); box-shadow: 0 2px 12px oklch(0.7 0.1 15 / 0.2); }
.opt-marker {
  flex-shrink: 0; width: 1.6rem; height: 1.6rem; border-radius: 50%;
  border: 2px solid oklch(0.8 0.04 30);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; font-weight: 700; color: var(--ink-faint); transition: all 0.25s ease; margin-top: 0.1rem;
}
.option-btn.selected .opt-marker { background: var(--rose); border-color: var(--rose); color: white; }
.quiz-nav { max-width: 700px; margin: 1.5rem auto 0; display: flex; justify-content: space-between; align-items: center; }
.btn-nav {
  padding: 0.7rem 1.5rem; border: 2px solid oklch(0.85 0.04 30); background: white;
  border-radius: 2rem; font-family: inherit; font-size: 0.88rem; font-weight: 500; color: var(--ink-light);
  cursor: pointer; transition: all 0.25s ease;
}
.btn-nav:hover:not(:disabled) { border-color: var(--rose); color: var(--rose-dark); }
.btn-nav:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-nav.primary { background: var(--rose); border-color: var(--rose); color: white; }
.btn-nav.primary:hover:not(:disabled) { background: var(--rose-dark); }

/* ═══════ RESULTS ═══════ */
.results-container {
  display: none; min-height: 100vh; padding: 2rem 1.5rem;
  background:
    radial-gradient(ellipse at 30% 20%, oklch(0.95 0.06 350 / 0.3), transparent 50%),
    radial-gradient(ellipse at 70% 70%, oklch(0.93 0.05 300 / 0.2), transparent 50%),
    var(--cream);
}
.results-inner { max-width: 800px; margin: 0 auto; }

/* ═══════ PERSONALITY CARD ═══════ */
.persona-card {
  background: white; border-radius: 1.5rem; padding: 2.5rem 2rem;
  margin-bottom: 2rem; text-align: center;
  box-shadow: 0 8px 40px oklch(0.7 0.1 15 / 0.15);
  position: relative; overflow: hidden;
}
.persona-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
}
\1\n.persona-card .persona-img { width: 210px; height: 210px; object-fit: cover; border-radius: 26px; display: block; margin: 0 auto 0.6rem; box-shadow: 0 12px 34px oklch(0.6 0.12 15 / 0.28); }
.persona-card .persona-title {
  font-family: 'Noto Serif SC', serif; font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 900; margin-bottom: 0.3rem; line-height: 1.3;
}
.persona-card .persona-subtitle {
  font-family: 'Noto Serif SC', serif; font-size: 1rem; color: var(--ink-faint);
  letter-spacing: 0.15em; margin-bottom: 1rem;
}
.persona-card .persona-tagline {
  font-size: 1.05rem; color: var(--ink-light); line-height: 1.7;
  max-width: 500px; margin: 0 auto 1.5rem; font-style: italic;
}
.persona-card .persona-color-bar {
  display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 1.5rem;
}
.persona-card .persona-keywords {
  display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
}
.persona-card .persona-keywords span {
  padding: 0.35rem 0.9rem; border-radius: 2rem; font-size: 0.78rem; font-weight: 600;
}

/* ═══════ SHARE CARD (for screenshot) ═══════ */
.share-card {
  background: white; border-radius: 1.5rem; padding: 2rem;
  margin-bottom: 2rem; box-shadow: 0 4px 24px oklch(0.8 0.02 30 / 0.2);
}
.share-card h3 { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; margin-bottom: 1rem; }
.share-card .share-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-bottom: 1rem;
}
.share-card .share-item {
  text-align: center; padding: 0.8rem 0.4rem; border-radius: 0.8rem;
  background: oklch(0.97 0.01 80);
}
.share-card .share-item .share-icon { font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }
.share-card .share-item .share-label { font-size: 0.65rem; color: var(--ink-faint); margin-bottom: 0.2rem; }
.share-card .share-item .share-value { font-size: 0.75rem; font-weight: 700; }

/* ═══════ RADAR ═══════ */
.radar-section {
  background: white; border-radius: 1rem; padding: 2rem; margin-bottom: 2rem;
  box-shadow: 0 2px 16px oklch(0.85 0.02 30 / 0.25); text-align: center;
}
.radar-section h3 { font-family: 'Noto Serif SC', serif; font-size: 1.15rem; margin-bottom: 1.5rem; }
.radar-canvas { max-width: 420px; margin: 0 auto; }

/* ═══════ DIMENSION CARDS ═══════ */
.dimension-results { display: grid; grid-template-columns: 1fr; gap: 1.2rem; margin-bottom: 2rem; }
.dim-card { background: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 2px 16px oklch(0.85 0.02 30 / 0.25); }
.dim-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
.dim-card-header h3 { font-family: 'Noto Serif SC', serif; font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
.dim-score { font-size: 1.5rem; font-weight: 900; color: var(--rose-dark); }
.dim-bar { width: 100%; height: 8px; background: oklch(0.93 0.02 30); border-radius: 4px; overflow: hidden; margin-bottom: 0.8rem; }
.dim-bar-fill { height: 100%; border-radius: 4px; transition: width 1s cubic-bezier(0.22,1,0.36,1); }
.dim-label { font-size: 0.85rem; color: var(--ink-faint); line-height: 1.6; }
.dim-type-badge { display: inline-block; padding: 0.2rem 0.7rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.5rem; }

/* ═══════ COMPAT / ADVICE ═══════ */
.compat-section, .advice-section {
  background: white; border-radius: 1rem; padding: 2rem; margin-bottom: 2rem;
  box-shadow: 0 2px 16px oklch(0.85 0.02 30 / 0.25);
}
.compat-section h3, .advice-section h3 {
  font-family: 'Noto Serif SC', serif; font-size: 1.15rem; margin-bottom: 1rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.compat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 0.8rem; }
.compat-item { padding: 1rem; border-radius: 0.8rem; text-align: center; }
.compat-item .compat-type { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.3rem; }
.compat-item .compat-score { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.2rem; }
.compat-item .compat-desc { font-size: 0.78rem; color: var(--ink-faint); }
.advice-section ul { list-style: none; padding: 0; }
.advice-section li {
  padding: 0.6rem 0; padding-left: 1.5rem; position: relative;
  font-size: 0.9rem; color: var(--ink-light); line-height: 1.6;
  border-bottom: 1px solid oklch(0.95 0.02 30);
}
.advice-section li:last-child { border-bottom: none; }
.advice-section li::before { content: '♡'; position: absolute; left: 0; color: var(--rose); }

/* ═══════ ACTIONS ═══════ */
.result-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
.btn-action {
  padding: 0.8rem 1.8rem; border-radius: 2rem;
  font-family: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer;
  transition: all 0.25s ease; border: 2px solid var(--rose);
}
.btn-action.primary { background: var(--rose); color: white; }
.btn-action.secondary { background: transparent; color: var(--rose-dark); }
.btn-action:hover { transform: translateY(-2px); box-shadow: 0 4px 16px oklch(0.7 0.1 15 / 0.2); }
.result-footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: var(--ink-faint); }

@media (max-width: 600px) {
  .landing { padding: 1.2rem; }
  .landing-emoji { font-size: 3.5rem; }
  .landing h1 { font-size: 1.8rem; }
  .landing .desc { font-size: 0.88rem; }
  .question-card { padding: 1.1rem; }
  .question-card h2 { font-size: 1rem; margin-bottom: 1.2rem; }
  .option-btn { padding: 0.85rem 0.9rem; font-size: 0.85rem; gap: 0.7rem; min-height: 44px; }
  .opt-marker { width: 1.4rem; height: 1.4rem; }
  .quiz-nav { padding: 0 0.5rem; }
  .btn-nav { padding: 0.6rem 1.2rem; font-size: 0.82rem; }
  .persona-card { padding: 1.8rem 1rem; }
  \1 .persona-card .persona-img { width: 150px; height: 150px; }
  .persona-card .persona-title { font-size: 1.6rem; }
  .share-card .share-grid { grid-template-columns: repeat(2, 1fr); }
  .dim-card { padding: 1.1rem; }
  .radar-canvas canvas { max-width: 300px; height: auto; }
  .result-actions { flex-direction: column; align-items: stretch; }
  .btn-action { text-align: center; }
  .compat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

<!-- ═══════ LANDING ═══════ -->
<section class="landing" id="landing">
  <div class="landing-content">
    <span class="landing-emoji">💕</span>

      通过 200+ 道行为场景题，从依恋风格、爱的语言、沟通模式等八大维度深度解析你的恋爱人格。<br>

<!-- ═══════ QUIZ ═══════ -->
<section class="quiz-container" id="quiz">
  <div class="quiz-header">
    <div class="quiz-header-inner">
      <div class="progress-info">
        <span><span class="q-num" id="qNum">1</span> / <span id="qTotal">0</span></span>
        <span class="dimension-label" id="dimLabel">—</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="question-card" id="questionCard">
    <p class="q-context" id="qContext"></p>
    <h2 id="qText"></h2>

  </div>

<!-- ═══════ RESULTS ═══════ -->
<section class="results-container" id="results">

    <div class="persona-card" id="personaCard"></div>

    <div class="compat-section" id="compatSection"></div>
    <div class="advice-section" id="adviceSection"></div>
    <div class="result-actions">
      <button class="btn-action primary" onclick="restart()">重新测试</button>
      <button class="btn-action secondary" onclick="exportResult()">导出结果</button>
      <button class="btn-action secondary" onclick="copyForAI()">复制给AI分析</button>
    </div>
    <div class="result-footer">恋人人格测试 · 基于依恋理论、爱的语言、大五人格等心理学框架<br>本测试仅供参考，不构成专业心理诊断</div>
  </div>
</section>

<script>
// ═══════════════════════════════════════════════════════════════
// LOVER PERSONALITY TEST v2 — 200+ Questions, 8 Dimensions
// ═══════════════════════════════════════════════════════════════

const DIMENSIONS = {
  attach:   { name:'依恋风格', en:'Attachment',     icon:'🔗', color:'oklch(0.65 0.18 15)' },
  love:     { name:'爱的语言', en:'Love Language',   icon:'💗', color:'oklch(0.65 0.18 350)' },
  comm:     { name:'沟通模式', en:'Communication',    icon:'💬', color:'oklch(0.6 0.14 240)' },
  conflict: { name:'冲突处理', en:'Conflict',         icon:'🕊️', color:'oklch(0.65 0.14 50)' },
  intimacy: { name:'亲密独立', en:'Intimacy',         icon:'🌙', color:'oklch(0.6 0.15 300)' },
  emotion:  { name:'情感表达', en:'Emotion',          icon:'🎭', color:'oklch(0.6 0.12 150)' },
  commit:   { name:'承诺忠诚', en:'Commitment',       icon:'💍', color:'oklch(0.7 0.14 80)' },
  romance:  { name:'浪漫倾向', en:'Romance',          icon:'🌹', color:'oklch(0.65 0.16 20)' }
};

const S7 = [
  {text:'非常不同意',score:1},{text:'不同意',score:2},{text:'有些不同意',score:3},
  {text:'中立',score:4},{text:'有些同意',score:5},{text:'同意',score:6},{text:'非常同意',score:7}
];
const S5F = [
  {text:'从不',score:1},{text:'很少',score:2},{text:'有时',score:3},{text:'经常',score:4},{text:'总是',score:5}
];

// ═══════ 200+ QUESTIONS ═══════
const Q = [
  // ────────────── 依恋风格 (28题) ──────────────
  {d:'attach',q:'伴侣超过两小时没回消息，你会？',o:[
    {t:'完全不在意，知道对方忙',s:1},{t:'偶尔想起来才看手机',s:2},{t:'会看手机但不焦虑',s:3},
    {t:'忍不住看了好几次',s:4},{t:'反复检查，开始担心',s:5},{t:'非常焦虑甚至打电话',s:6},{t:'感到被抛弃的恐惧',s:7}]},

}

function selectOpt(i) {
  ans[cur] = i;
  document.querySelectorAll('.option-btn').forEach((b, j) => b.classList.toggle('selected', j === i));
  document.getElementById('btnNext').disabled = false;
  setTimeout(() => { if (cur < Q.length - 1) nextQ(); }, 350);
}

function nextQ() {
  if (ans[cur] === null) return;
  if (cur < Q.length - 1) { cur++; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); }
  else showResults();
}

function prevQ() {
  if (cur > 0) { cur--; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); }
}

// ═══════ SCORING ═══════
function calcScores() {
  const acc = {};
  for (const d of Object.keys(DIMENSIONS)) acc[d] = [];
  Q.forEach((q, i) => {
    if (ans[i] === null) return;
    let lo = Infinity, hi = -Infinity;
    for (const o of q.o) { if (o.s < lo) lo = o.s; if (o.s > hi) hi = o.s; }
    let v = hi > lo ? (q.o[ans[i]].s - lo) / (hi - lo) : 0.5;
    if (q.r) v = 1 - v;
    acc[q.d].push(v);
  });
  const norm = {};
  for (const d of Object.keys(acc)) {
    const a = acc[d];
    norm[d] = a.length ? 1 + 4 * (a.reduce((x, y) => x + y, 0) / a.length) : 3;
  }
  return norm;
}

function getType(dim, score) {
  const types = DIM_TYPES[dim];
  for (const [k, v] of Object.entries(types)) {
    if (score >= v.range[0] && score < v.range[1]) return {key:k,...v};
  }
  return {key:Object.keys(types).pop(), ...Object.values(types).pop()};
}

function getLoveLang() {
  const ls = {words:0,acts:0,gifts:0,quality:0,touch:0};
  Q.forEach((q, i) => {
    if (q.d !== 'love' || ans[i] === null) return;
    const s = q.o[ans[i]].s;
    if (s===5) ls.gifts+=2; else if (s===4) ls.words+=2;
    else if (s===3) ls.quality+=2; else if (s===2) ls.acts+=2;
    else if (s===1) ls.touch+=2;
  });
  let mk='quality',mv=0;
  for (const [k,v] of Object.entries(ls)) if(v>mv){mv=v;mk=k;}
  return {key:mk,...DIM_TYPES.love[mk]};
}

// 最近原型向量匹配：任意 8 维分向量都会归到几何上最近的人格，
// 全空间无缝覆盖，且每个人格都经蒙特卡洛模拟验证可达。
const PROTO_DIMS = ['attach','love','comm','conflict','intimacy','emotion','commit','romance'];
const PROTO_W = [1,0.5,1,1,1,1,1,1];
function getPersona(scores) {
  const v = PROTO_DIMS.map(d => scores[d]);
  let best = PERSONA_TYPES[PERSONA_TYPES.length - 1], bd = Infinity;
  for (const p of PERSONA_TYPES) {
    let d = 0;
    for (let k = 0; k < 8; k++) { const diff = v[k] - p.proto[k]; d += PROTO_W[k] * diff * diff; }
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function drawRadar(scores) {
  const c = document.getElementById('radarChart');
  const ctx = c.getContext('2d');
  const W=c.width, H=c.height, cx=W/2, cy=H/2, R=Math.min(W,H)*0.36;
  ctx.clearRect(0,0,W,H);
  const dims = Object.keys(DIMENSIONS), n=dims.length, step=2*Math.PI/n;
  for (let r=1;r<=5;r++) {
    const rr=R*r/5;
    ctx.beginPath();
    for (let i=0;i<=n;i++) { const a=-Math.PI/2+i*step; const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.closePath(); ctx.strokeStyle='oklch(0.88 0.02 30)'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.font='12px "Noto Sans SC"'; ctx.fillStyle='oklch(0.4 0.02 30)'; ctx.textAlign='center'; ctx.textBaseline='middle';
  dims.forEach((d,i) => {
    const a=-Math.PI/2+i*step;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a)); ctx.strokeStyle='oklch(0.9 0.02 30)'; ctx.stroke();
    ctx.fillText(DIMENSIONS[d].icon+DIMENSIONS[d].name, cx+(R+22)*Math.cos(a), cy+(R+22)*Math.sin(a));
  });
  ctx.beginPath();
  dims.forEach((d,i) => { const a=-Math.PI/2+i*step, r=R*(scores[d]-1)/4; const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.closePath(); ctx.fillStyle='oklch(0.65 0.18 15 / 0.15)'; ctx.fill(); ctx.strokeStyle='oklch(0.65 0.18 15)'; ctx.lineWidth=2; ctx.stroke();
  dims.forEach((d,i) => { const a=-Math.PI/2+i*step, r=R*(scores[d]-1)/4; ctx.beginPath(); ctx.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),4,0,2*Math.PI); ctx.fillStyle='oklch(0.65 0.18 15)'; ctx.fill(); ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.stroke(); });
}

function renderCompat(types, scores) {
  const s = document.getElementById('compatSection');
  const at = types.attach.key;
  const cd = {secure:{secure:95,anxious:78,fearful:72},anxious:{secure:80,anxious:62,fearful:52},fearful:{secure:74,anxious:54,fearful:50}};
  const tn={secure:'安全型',anxious:'焦虑型',fearful:'高敏型'};
  const ti={secure:'🛡️',anxious:'🌊',fearful:'🌪️'};
  const co=s=>s>=75?'oklch(0.7 0.15 150)':s>=60?'oklch(0.75 0.14 80)':s>=45?'oklch(0.7 0.12 50)':'oklch(0.65 0.15 15)';
  const cmp=cd[at]||cd.secure;
  let h='<h3>💕 兼容性分析</h3><div class="compat-grid">';
  for (const [t,sc] of Object.entries(cmp)) h+=`<div class="compat-item" style="background:${co(sc).replace(')', ' / 0.1)')}"><div class="compat-type">${ti[t]} ${tn[t]}</div><div class="compat-score" style="color:${co(sc)}">${sc}%</div><div class="compat-desc">${sc>=75?'高度兼容':sc>=60?'良好兼容':sc>=45?'需要磨合':'挑战较大'}</div></div>`;
  s.innerHTML=h+'</div>';
}

function renderAdvice(types, scores) {
  const s = document.getElementById('adviceSection');
  const adv = {
    secure:['继续保持这份坦诚，它比你以为的更难得','在对方需要时稳稳地在，就够了','别光顾着照顾对方，也记得问问自己想要什么','可以试着把你的安全感“借”给更慌的那个人','偶尔给关系做个“体检”，聊聊彼此最近的感受'],
    anxious:['焦虑上来时，先别急着发消息，给自己十分钟','把日子过厚一点——你的爱好越多，悬着的心越少','用“我感觉…”代替“你总是…”，对方会更听得进去','留意自己最容易慌的那个瞬间，提前跟对方说好','靠近一个稳定的人，安全感是会传染的'],
    fearful:['想推开对方的时候，试着先说出口而不是直接消失','给情绪起个名字，“我现在是怕，不是不爱”','在足够安全的关系里，一点一点地练习示弱','提醒自己：你值得被好好爱，这不是奢求','慢慢来，没人催你立刻交出全部的信任']
  };
  const a=adv[types.attach.key]||adv.secure;
  s.innerHTML=`<h3>💡 成长建议</h3><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
}

function exportResult() {
  const {scores,types,persona}=window._result;
  let md=`# 💕 恋人人格测试结果\n\n测试时间：${new Date().toLocaleString('zh-CN')}\n\n`;
  md+=`## 我的恋爱人格：${persona.animal} ${persona.title}\n\n**${persona.en}**\n\n${persona.desc}\n\n`;
  md+=`**关键词**：${persona.keywords.join(' · ')}\n\n`;
  md+=`## 八维度分析\n\n`;
  for (const d of Object.keys(DIMENSIONS)) {
    const dim=DIMENSIONS[d], t=types[d], pct=((scores[d]-1)/4*100).toFixed(0);
    md+=`### ${dim.icon} ${dim.name}：${t.name} (${pct}%)\n${t.desc}\n\n`;
  }
  md+=`## 详细作答记录\n\n`;
  Q.forEach((q,i) => { const a=ans[i]!==null?q.o[ans[i]].t:'未作答'; md+=`${i+1}. [${DIMENSIONS[q.d].name}] ${q.q}\n   → ${a}\n`; });
  const blob=new Blob([md],{type:'text/markdown'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='恋人人格测试结果.md'; a.click(); URL.revokeObjectURL(url);
}

function copyForAI() {
  const {scores,types,persona}=window._result;
  let t=`我刚做了恋人人格测试！\n\n我的恋爱人格是：${persona.animal} ${persona.title}（${persona.en}）\n\n${persona.desc}\n\n关键词：${persona.keywords.join(' · ')}\n\n各维度：\n`;
  for (const d of Object.keys(DIMENSIONS)) t+=`- ${DIMENSIONS[d].name}：${types[d].name} (${((scores[d]-1)/4*100).toFixed(0)}%)\n`;
  t+='\n请帮我深度分析这个人格类型在恋爱中的优势、劣势和建议。\n\n详细作答：\n';
  Q.forEach((q,i) => { t+=`${i+1}. ${q.q} → ${ans[i]!==null?q.o[ans[i]].t:'未作答'}\n`; });
  navigator.clipboard.writeText(t).then(()=>alert('已复制！粘贴给AI即可获得深度分析。')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('已复制！');});
}

function restart() {
  cur=0; ans=new Array(Q.length).fill(null);
  document.getElementById('results').style.display='none';
  document.getElementById('landing').style.display='flex';
  window.scrollTo({top:0,behavior:'smooth'});
}

// Chatbot API
window.LoverTest = {
  getResult: () => window._result || null,
  restart,
  getQuestions: () => Q.map((q,i) => ({id:i,dim:q.d,question:q.q,options:q.o.map(o=>o.t)})),
  submitAnswer: (qi,oi) => { if(qi>=0&&qi<Q.length&&oi>=0&&oi<Q[qi].o.length){ans[qi]=oi;return true;}return false; },
  getPersona: () => { const s=calcScores(); return getPersona(s); }
};
